<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Forza 1 Rotations</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="wordmark">FORZA<b>1</b></span><span class="brandtxt"><b id="teamName">Rotations</b><small>Forza 1 use only</small></span></div>
  <button id="acct" class="ghost" hidden>Account</button>
</header>
<main id="view" aria-live="polite"><p class="muted pad">Loading…</p></main>
<nav class="tabs" id="tabs" hidden>
  <button data-tab="rot">Rotations</button>
  <button data-tab="mine">My player</button>
  <button data-tab="live">Games</button>
  <button data-tab="stats">Stats</button>
  <button data-tab="team">Team</button>
</nav>
<div class="sheet" id="sheet" hidden><div class="sheet-card" role="dialog" aria-modal="true" id="sheetCard"></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
